<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MakerWorld Analytics</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <a class="skip" href="#view">Zum Inhalt springen</a>
  <header class="topbar">
    <button id="navToggle" class="navtoggle" aria-label="Menü öffnen" aria-expanded="false" aria-controls="sidebar">&#9776;</button>
    <span class="topbar-title">MakerWorld Analytics</span>
  </header>
  <div id="navScrim" class="scrim" hidden></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">MW</span><div><b>ANALYTICS</b><small id="handle">@you</small></div></div>
    <div class="searchbox"><input id="globalSearch" type="search" aria-label="Suche in Modellen, Kunden und Projekten" placeholder="Suche (Modelle, Kunden, Projekte)" autocomplete="off"><div id="searchResults" class="search-results" hidden></div></div>
    <nav aria-label="Hauptnavigation">
      <a data-section="heute" data-route="heute" href="#heute" class="active">Heute</a>
      <div class="nav-sep">Analyse</div>
      <a data-section="modelle" data-route="overview" href="#modelle">Modelle</a>
      <a data-section="auswertung" data-route="report" href="#auswertung">Auswertung</a>
      <div class="nav-sep">Geschäft</div>
      <a data-section="kunden" data-route="contacts" href="#kunden">Kunden</a>
      <a data-section="projekte" data-route="projekte" href="#projekte">Projekte</a>
      <a data-section="revenue" data-route="revenue" href="#revenue">Finanzen</a>
      <div class="nav-sep">Produktion</div>
      <a data-section="entwuerfe" data-route="pipeline" href="#entwuerfe">Ideen &amp; Entwürfe</a>
      <a data-section="materialkalk" data-route="teile" href="#materialkalk">Material &amp; Kalkulation</a>
      <div class="nav-sep">System</div>
      <a data-section="todos" data-route="todos" href="#todos">Aufgaben<span class="cnt" id="todoCnt">0</span></a>
      <a data-section="data" data-route="data" href="#data">Daten &amp; Pull</a>
    </nav>
    <div class="pull-box">
      <button id="pullBtn" class="btn primary">Live-Pull starten</button>
      <div id="pullStatus" class="pull-status"></div>
    </div>
    <div class="langsw" id="langSw"><a data-lang="de" href="#" role="button">DE</a><span>·</span><a data-lang="en" href="#" role="button">EN</a></div>
    <div class="sidefoot" id="lastPull"></div>
  </aside>

  <main id="view" tabindex="-1"><div class="loading">lädt …</div></main>

  <!-- Modell-Detail Overlay -->
  <div id="drawer" class="drawer hidden"><div class="drawer-inner" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1"></div></div>
</body>
<script src="app.js"></script>
</html>
