name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API and operations tests
        run: npm test
      - name: Browser tests (UI + complete English audit)
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
